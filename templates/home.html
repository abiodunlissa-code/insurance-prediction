<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurance Bill Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link type="text/css" rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero-card">
      <div class="hero-copy">
        <p class="eyebrow">AI Insurance Estimator</p>
        <h1>Predict insurance costs in seconds</h1>
        <p>Enter a few details to estimate the expected medical insurance bill for a customer.</p>
      </div>

      <div class="form-card">
        <form action="/predict" method="POST" class="predict-form">
          <div class="form-grid">
            <label>
              <span>Age</span>
              <input type="number" name="age" min="0" placeholder="e.g. 30" required>
            </label>

            <label>
              <span>Sex</span>
              <select name="sex" required>
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </label>

            <label>
              <span>BMI</span>
              <input type="number" step="0.1" name="bmi" placeholder="e.g. 27.9" required>
            </label>

            <label>
              <span>Children</span>
              <input type="number" name="children" min="0" placeholder="e.g. 2" required>
            </label>

            <label>
              <span>Smoker</span>
              <select name="smoker" required>
                <option value="">Select</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
              </select>
            </label>

            <label>
              <span>Region</span>
              <select name="region" required>
                <option value="">Select</option>
                <option value="southwest">Southwest</option>
                <option value="southeast">Southeast</option>
                <option value="northwest">Northwest</option>
                <option value="northeast">Northeast</option>
              </select>
            </label>
          </div>

          <button type="submit">Predict Bill</button>
        </form>

        {% if pred %}
        <div class="result-card">
          <p class="result-label">Estimated Cost</p>
          <h2>${{ "{:,.0f}".format(pred|float) }}</h2>
        </div>
        {% endif %}
      </div>
    </section>
  </main>
</body>
</html>
